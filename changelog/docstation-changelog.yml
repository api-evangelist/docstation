  breaking: false
  highlights:
  - UCare Minnesota program launched with on-demand CMR task generation
  - Remittance tab moved from beta to general availability for all customers
  - Prescriber-to-rendering-provider template function for BIN-billed claims
  - ERA enrollments auto-approved when a matching clearinghouse ERA is received
  - EDI enrollment status checks fully automated with daily runs
  - Auto-submit control per location without rule duplication
  - Claim reversal filtering by initiation date; additional bulk update fields
  - Live calculator for units and billed amounts; project identifier tagging
  - CSV import improvements (status messaging, date handling, address line 2)
  - Medicare Part A-only coverage detection; HMO plan detection with override
  - AI (internal alpha) claim auto-summary, "Query with AI" filter, Copilot custom
    instructions
