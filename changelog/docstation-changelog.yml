notes: >-
  DocStation publishes a dated product changelog as a "Changelog & Releases" blog
  category, on a roughly quarterly cadence, plus a "Product Updates" collection in
  the help center. There is no API version number, no semantic version, and no
  breaking-change notice — the changelog describes application features, not an
  API contract, because DocStation publishes no public developer API.
