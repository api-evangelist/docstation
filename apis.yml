aid: docstation
name: DocStation
description: >-
  DocStation is a unified pharmacy care and medical billing platform that helps
  community and clinical pharmacies move beyond prescription dispensing to bill
  insurance for the clinical services they already provide — vaccines, MTM,
  point-of-care testing, consultations, and DME. The platform consolidates
  360-degree patient records, automated medical claims generation and
  resubmission, smart scheduling with public booking links, connected SMS and
  organization-to-organization messaging, workflow automation, and live revenue
  analytics into a single system. It integrates with pharmacy management systems
  (PioneerRx, Liberty, DRX), 1,000+ health plans, clearinghouses, and state
  immunization registries. DocStation is HIPAA compliant and SOC 2 Type II
  audited. Backed by Techstars; added to the API Evangelist network and enriched
  from its public surface. No public developer API is documented at this time.
